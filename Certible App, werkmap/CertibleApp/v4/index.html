<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certible GUI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Certible - Certificate Manager</h1>

  <div id="tabs"></div>
  <div class="controls">
    <button onclick="toggleMiniView()">🔍 Mini View</button>
    <button onclick="toggleColumnPicker()">🧩 Choose Columns</button>
    <button onclick="exportData('csv')">💾 Export CSV</button>
    <button onclick="exportData('json')">💾 Export JSON</button>
    <button onclick="exportData('xlsx')">💾 Export XLSX</button>
    <button onclick="exportData('pdf')">💾 Export PDF</button>
    <div id="column-picker" class="column-picker"></div>
  </div>

  <table id="dataTable">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
